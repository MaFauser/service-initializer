spring:
  mvc:
    problemdetails:
      enabled: true
  output:
    ansi:
      enabled: detect
  application:
    name: service

  datasource:
    url: ${POSTGRES_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        '[format_sql]': true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    web:
      pageable:
        max-page-size: 100

  cache:
    type: simple

  graphql:
    graphiql:
      enabled: true
      path: /graphiql

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:https://your-idp.example.com/realms/your-realm}

logging:
  level:
    '[com.mafauser.service]': DEBUG

management:
  server:
    port: 8082
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        '[http.server.requests]': true
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  tracing:
    sampling:
      probability: 1.0
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTLP_TRACES_ENDPOINT}
  otlp:
    metrics:
      export:
        enabled: false

server:
  port: 8081

rate-limit:
  enabled: true
  requests-per-minute: 60

---
# Profile k8s = Kubernetes (OKE). Profile vps = server/VM deploy. Redis/Kafka are not on the prod image; use profile local + Docker Compose for those.
spring:
  config:
    activate:
      on-profile: k8s,vps
  output:
    ansi:
      enabled: never

  datasource:
    hikari:
      max-lifetime: 600000
      connection-timeout: 20000
      keepalive-time: 30000

  flyway:
    baseline-on-migrate: false

  graphql:
    graphiql:
      enabled: false

management:
  prometheus:
    metrics:
      export:
        enabled: true
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}

server:
  forward-headers-strategy: framework
